    <style>
        /* Reset & Base */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        
        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        /* Animated Aurora Background */
        
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.45;
            animation: float 20s infinite ease-in-out alternate;
        }
        
        .blob-1 {
            width: 450px;
            height: 450px;
            background: #7f00ff;
            top: -100px;
            left: -150px;
        }
        
        .blob-2 {
            width: 350px;
            height: 350px;
            background: #e94560;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }
        
        .blob-3 {
            width: 300px;
            height: 300px;
            background: #00c6ff;
            top: 40%;
            left: 60%;
            animation-delay: -10s;
        }
        
        .blob-4 {
            width: 250px;
            height: 250px;
            background: #ff8c00;
            top: 20%;
            right: 10%;
            animation-delay: -15s;
            opacity: 0.3;
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(40px, -60px) scale(1.15) rotate(180deg);
            }
            100% {
                transform: translate(-30px, 40px) scale(0.9) rotate(360deg);
            }
        }
        /* Grid Overlay for Texture */
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }
        /* Main Container */
        
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            z-index: 1;
            margin-top: 20px;
        }
        /* Profile Section */
        
        .profile-section {
            margin-bottom: 40px;
            animation: fadeInDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .profile-img-container {
            width: 150px;
            height: 185px;
            margin: 0 auto 20px;
            position: relative;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #7f00ff, #e94560, #00c6ff);
            box-shadow: 0 0 25px rgba(127, 0, 255, 0.5);
            animation: pulseGlow 3s infinite alternate;
            transition: transform 0.4s ease;
        }
        
        .profile-img-container:hover {
            transform: scale(1.05) translateY(-5px);
        }
        
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 20px rgba(127, 0, 255, 0.4), 0 0 40px rgba(233, 69, 96, 0.2);
            }
            100% {
                box-shadow: 0 0 35px rgba(0, 198, 255, 0.6), 0 0 50px rgba(127, 0, 255, 0.4);
            }
        }
        
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #050505;
            display: block;
            transition: transform 0.4s ease;
        }
        
        .name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #a8a8a8, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 4s linear infinite;
        }
        
        @keyframes shineText {
            to {
                background-position: 200% center;
            }
        }
        
        .bio {
            font-size: 1.05rem;
            color: #b3b3b3;
            font-weight: 300;
            max-width: 90%;
            margin: 0 auto;
            line-height: 1.6;
        }
        /* Links Section */
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .link-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #fff;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 1.15rem;
            font-weight: 500;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }
        /* Entrance Animations */
        
        .links .link-card:nth-child(1) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards;
        }
        
        .links .link-card:nth-child(2) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s forwards;
        }
        
        .links .link-card:nth-child(3) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s forwards;
        }
        
        .links .link-card:nth-child(4) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s forwards;
        }
        
        .links .link-card:nth-child(5) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.55s forwards;
        }
        
        .links .link-card:nth-child(6) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.65s forwards;
        }
        
        .links .link-card:nth-child(7) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.75s forwards;
        }
        
        .links .link-card:nth-child(8) {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.85s forwards;
        }
        
        .link-card i {
            font-size: 1.5rem;
            width: 30px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .link-card span {
            flex: 1;
            text-align: left;
            letter-spacing: 0.3px;
        }
        
        .link-card .arrow {
            font-size: 1.1rem;
            opacity: 0;
            transform: translateX(-15px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* Hover Effects & Brand Glows */
        
        .link-card:hover {
            transform: translateY(-6px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }
        
        .link-card:hover i {
            transform: scale(1.15);
        }
        
        .link-card:hover .arrow {
            transform: translateX(0);
            opacity: 1;
        }
        
        .link-card.website:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(255, 255, 255, 0.15);
        }
        
        .link-card.github:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(171, 71, 188, 0.3);
        }
        
        .link-card.facebook:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(24, 119, 242, 0.35);
        }
        
        .link-card.snapchat:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(255, 252, 0, 0.25);
        }
        
        .link-card.twitter:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(29, 161, 242, 0.3);
        }
        
        .link-card.youtube:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(255, 0, 0, 0.3);
        }
        
        .link-card.instagram:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(225, 48, 108, 0.35);
        }
        
        .link-card.tiktok:hover {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgb(0, 0, 0);
        }
        /* Small Social Icons Row */
        
        .social-icons-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
            opacity: 0;
        }
        
        .social-icon {
            color: #888;
            font-size: 1.4rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            text-decoration: none;
        }
        
        .social-icon:hover {
            color: #fff;
            transform: translateY(-5px) scale(1.1);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
        /* Footer */
        
        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #555;
            font-weight: 400;
            letter-spacing: 1px;
            animation: fadeIn 1s ease-out 1s forwards;
            opacity: 0;
        }
        /* Keyframes */
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
